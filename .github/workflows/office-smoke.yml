name: Office smoke test

# Does what docs/getting-started.md says, on a clean runner, with the released Wine: create the
# prefix, install the WebView2 runtime and Word (from Microsoft's own installer), turn on the
# sign-in path, start Word, and look at it.  It cannot sign in -- that needs a person with a
# subscription -- so it proves everything up to Office's own sign-in prompt, and keeps a
# screenshot of what Word shows.
#
# Run it by hand from the Actions tab.  It downloads a few GB from Microsoft and takes a while.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release whose Wine build is tested (a tag, or 'nightly')"
        required: false
        default: nightly

permissions:
  contents: read

jobs:
  smoke:
    name: Install Word and start it
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DEBIAN_FRONTEND: noninteractive
      WINE: /opt/wine-altars/bin/wine
      WINEPREFIX: /mnt/office-smoke/prefix      # the big disk of the runner; Office needs ~10 GB
      OFFICE_APPS: word
    steps:
      - uses: actions/checkout@v7

      - name: Runtime libraries, as the README says (the distribution's wine package brings them)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine xvfb x11-utils imagemagick \
            libgl1-mesa-dri fonts-liberation
          sudo mkdir -p /mnt/office-smoke
          sudo chown "$USER" /mnt/office-smoke
          df -h /mnt

      - name: Get the release build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "${TAG:-nightly}" -R "$GITHUB_REPOSITORY" -p wine-altars-linux-x86_64.tar.xz -p SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          sudo tar -C /opt -xf wine-altars-linux-x86_64.tar.xz
          cat /opt/wine-altars/RELEASE.txt
          /opt/wine-altars/bin/wine --version
          echo /opt/wine-altars/bin >> "$GITHUB_PATH"

      # one step per stage, so a slow or stuck stage is visible and bounded on its own
      - name: "1. prefix"
        timeout-minutes: 10
        run: xvfb-run -a -s '-screen 0 1920x1080x24' scripts/office-setup.sh prefix

      - name: "2. WebView2 runtime"
        timeout-minutes: 30
        run: xvfb-run -a -s '-screen 0 1920x1080x24' scripts/office-setup.sh webview2

      - name: "3. Word, from Microsoft's installer"
        timeout-minutes: 80
        run: xvfb-run -a -s '-screen 0 1920x1080x24' scripts/office-setup.sh install

      - name: "4. sign-in switches"
        run: xvfb-run -a -s '-screen 0 1920x1080x24' scripts/office-setup.sh signin

      - name: Status
        run: scripts/office-setup.sh status

      - name: Start Word and look at it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cat > "$RUNNER_TEMP/look.sh" <<'LOOK'
          set -u
          scripts/office-setup.sh launch word
          # Word is slow to come up without a GPU; give it two minutes, checking as it goes
          for i in $(seq 1 24); do
              sleep 5
              if xwininfo -root -tree | grep -qi 'winword.exe'; then seen=1; fi
              pgrep -f '[W]INWORD.EXE' >/dev/null || { echo "Word exited"; break; }
          done
          sleep 20
          xwininfo -root -tree > "$RUNNER_TEMP/out/windows.txt" || true
          import -window root "$RUNNER_TEMP/out/word.png" || true
          pgrep -f '[W]INWORD.EXE' >/dev/null && alive=1 || alive=0
          echo "window seen: ${seen:-0}, still running: $alive"
          [ "${seen:-0}" = 1 ] && [ "$alive" = 1 ]
          LOOK
          xvfb-run -a -s '-screen 0 1920x1080x24' bash "$RUNNER_TEMP/look.sh"

      - name: Keep the evidence
        if: always()
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          cp -r "$WINEPREFIX/drive_c/c2rlog" "$out/c2rlog" 2>/dev/null || true
          cp "${TMPDIR:-/tmp}/office-WINWORD.EXE.log" "$out/" 2>/dev/null || true
          find "$WINEPREFIX/drive_c/users" -path '*Diagnostics/WINWORD/*' -type f -size -20M -exec cp -t "$out" {} + 2>/dev/null || true
          ls -l "$out"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: word-first-start
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
