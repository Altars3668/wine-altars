name: CI

# Cheap checks on every push and pull request: the scripts parse and pass their tests, and the
# patch series still applies to the upstream commit it is pinned to.  (The expensive part -- the
# actual build -- is release.yml.)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Scripts and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Shell scripts parse, and shellcheck finds no errors
        run: |
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
          mapfile -t files < <(git ls-files '*.sh')
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck -S error "${files[@]}"
          echo "${#files[@]} shell scripts checked"

      - name: Python scripts parse
        run: |
          python3 - <<'EOF'
          import ast, subprocess, sys
          files = subprocess.check_output(["git", "ls-files", "*.py"], text=True).split()
          for f in files:
              ast.parse(open(f, encoding="utf-8").read(), f)
          print(len(files), "python files parse")
          EOF

      - name: Unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: No credentials or personal data in tracked files
        run: |
          # a cheap tripwire, not a scanner: the things that must never be committed
          if git grep -I -n -E '(-----BEGIN [A-Z ]*PRIVATE KEY|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}\.|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' -- . ':!patches'; then
              echo "::error::something that looks like a secret is committed"; exit 1
          fi

  series:
    name: Patch series applies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the pinned upstream commit and apply every patch
        env:
          WORK: ${{ runner.temp }}/series
          STAGES: fetch apply
        run: scripts/build-from-series.sh
