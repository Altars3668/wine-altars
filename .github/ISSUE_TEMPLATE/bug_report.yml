name: Something does not work
description: Office, the build, or a script misbehaves
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Logs from Wine and from Office contain **account names, tenant ids, device ids and request URLs**.
        Read what you paste and remove those first. Never paste a token, a cookie, a licence file or
        anything from `OneAuth` / `IdentityCache`.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
      description: The step you were on (see docs/getting-started.md), what you saw, what you expected.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `scripts/office-setup.sh status`
      render: text
    validations:
      required: true
  - type: input
    id: wine
    attributes:
      label: Wine
      description: Output of `wine --version`, and whether it is the release build or your own
      placeholder: wine-11.19-578-g… (release v11.19-altars.1)
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, display server and GPU driver
      placeholder: Ubuntu 24.04, GNOME on Wayland (Xwayland), Mesa 25.x on AMD
  - type: textarea
    id: log
    attributes:
      label: The first error line, and a few lines around it
      description: From the script, `$WINEPREFIX/drive_c/c2rlog/*.log`, or a `WINEDEBUG` trace. Redacted.
      render: text
  - type: checkboxes
    id: redacted
    attributes:
      label: Before you submit
      options:
        - label: I removed account names, tenant and device ids, tokens and cookies from everything above.
          required: true
